services:
  db:
    image: postgres:16-alpine
    container_name: desktop-stock-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Descomenta si necesitas conectarte a la base desde el host (ej. con un cliente SQL):
    # ports:
    #   - "5432:5432"

  api:
    build: .
    container_name: desktop-stock-api
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./usuarios:/app/usuarios
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, la API debe conectarse al servicio "db", no a localhost.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"  # Reemplaza con tu UID:GID (ejecuta `id -u` / `id -g` en tu host)
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

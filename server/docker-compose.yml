services:
  api:
    build: .
    container_name: desktop-stock-api
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./usuarios:/app/usuarios
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"  # Reemplaza con tu UID:GID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os, sys; sys.exit(0 if urllib.request.urlopen(f'http://localhost:{os.environ[\"API_PORT\"]}/api/v1/').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s